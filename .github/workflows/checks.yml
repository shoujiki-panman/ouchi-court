name: Regression checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run offline tests
        run: node --test tests/*.test.mjs
      - name: Install pinned browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/ouchi-browser-tests" --no-save --package-lock=false playwright@1.64.1
          "$RUNNER_TEMP/ouchi-browser-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run browser fixture regressions
        env:
          NODE_PATH: ${{ runner.temp }}/ouchi-browser-tests/node_modules
        run: |
          node tests/seat.cjs
          node tests/dom-escape.cjs
          node tests/session-lifecycle.cjs
