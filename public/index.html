<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おうち裁判</title>
<style>
  :root { --bg: #14110e; --wood: #3b2a1c; --wood2: #5a4029; --ink: #f5efe6; --muted: #b9ab98; --gold: #e8b65c; --red: #d8432f; --blue: #3f7fd8; --box: rgba(10, 18, 40, .88); --boxline: #9fb6e8; }
  :root[data-theme="light"] { --bg: #efe7da; --ink: #f5efe6; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; overflow-x: hidden; }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 1.5rem; margin: 4px 0; letter-spacing: .05em; }
  .sub { color: var(--muted); margin: 0; font-size: .9rem; }

  /* 法廷の舞台 */
  #stage { position: relative; margin: 12px 0; height: 400px; border-radius: 16px; overflow: hidden;
    background: linear-gradient(180deg, #6b4a2f 0%, #4a321f 55%, #2c1e13 56%, #3b2a1c 100%); box-shadow: inset 0 0 60px rgba(0,0,0,.6); }
  #stage.shake { animation: shake .45s; }
  @keyframes shake { 20%{transform:translate(-10px,4px)} 40%{transform:translate(9px,-5px)} 60%{transform:translate(-7px,3px)} 80%{transform:translate(5px,-2px)} }
  #portrait { position: absolute; left: 50%; bottom: 158px; transform: translateX(-50%); font-size: 128px; line-height: 1; filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)); transition: transform .2s; }
  #portrait.talk { animation: bob .35s infinite alternate; }
  @keyframes bob { to { transform: translateX(-50%) translateY(-6px); } }
  #desk { position: absolute; left: 0; right: 0; bottom: 134px; height: 30px; background: var(--wood2); border-top: 3px solid #7a5838; }
  #nameplate { position: absolute; left: 18px; bottom: 135px; z-index: 2; background: var(--gold); color: #2b1d10; font-weight: 800; padding: 4px 14px; border-radius: 6px 6px 0 0; font-size: .95rem; }
  #box { position: absolute; left: 12px; right: 12px; bottom: 12px; height: 120px; background: var(--box); border: 3px solid var(--boxline); border-radius: 10px; padding: 12px 16px; font-size: 1.1rem; line-height: 1.6; overflow-y: auto; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #flash.on { animation: flash .35s; }
  @keyframes flash { 0%{opacity:.9} 100%{opacity:0} }

  /* 異議あり！ */
  #shout { position: absolute; left: 50%; top: 42%; transform: translate(-50%,-50%) scale(0) rotate(-6deg); padding: 22px 36px; font-size: 3.2rem; font-weight: 900; color: #fff; background: var(--red);
    clip-path: polygon(0 18%, 12% 0, 26% 14%, 42% 0, 56% 12%, 72% 0, 86% 16%, 100% 6%, 92% 34%, 100% 52%, 90% 66%, 100% 88%, 80% 82%, 66% 100%, 52% 86%, 36% 100%, 22% 84%, 6% 100%, 10% 74%, 0 58%, 8% 40%);
    -webkit-text-stroke: 2px #2b0a05; white-space: nowrap; pointer-events: none; }
  #shout.on { animation: shout 1.4s forwards; }
  #shout.blue { background: var(--blue); }
  @keyframes shout { 0%{transform:translate(-50%,-50%) scale(0) rotate(-6deg)} 12%{transform:translate(-50%,-50%) scale(1.15) rotate(-6deg)} 20%{transform:translate(-50%,-50%) scale(1) rotate(-6deg)} 85%{opacity:1} 100%{opacity:0; transform:translate(-50%,-50%) scale(1) rotate(-6deg)} }

  /* 判決のはんこ */
  #stamp { position: absolute; left: 50%; top: 40%; transform: translate(-50%,-50%) scale(3); opacity: 0; font-size: 4.4rem; font-weight: 900; color: var(--red); border: 8px solid var(--red); border-radius: 14px; padding: 6px 26px; background: rgba(255,255,255,.92); pointer-events: none; letter-spacing: .1em; }
  #stamp.on { animation: stamp .5s forwards; }
  @keyframes stamp { to { transform: translate(-50%,-50%) scale(1) rotate(-8deg); opacity: 1; } }

  .bench { display: flex; gap: 6px; flex-wrap: wrap; }
  .cast { background: #241a12; border: 1px solid #4a3622; border-radius: 10px; padding: 4px 10px; font-size: .8rem; color: var(--muted); }
  .cast.on { color: var(--gold); border-color: var(--gold); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
  button { font: inherit; font-weight: 700; padding: 12px 20px; border-radius: 999px; border: 0; background: var(--gold); color: #2b1d10; cursor: pointer; }
  button:disabled { opacity: .35; cursor: default; }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid #5a4632; }
  button.objection { background: var(--red); color: #fff; }
  input { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid #5a4632; background: #241a12; color: var(--ink); width: 10em; }
  #status { color: var(--muted); margin: 4px 0; min-height: 1.4em; font-size: .9rem; }
  #evidence { display: flex; gap: 8px; flex-wrap: wrap; }
  .ev { width: 96px; border: 2px solid var(--gold); border-radius: 8px; overflow: hidden; background: #241a12; font-size: .7rem; text-align: center; }
  .ev img { width: 100%; height: 72px; object-fit: cover; display: block; }
  #cam { display: none; margin: 8px 0; }
  #cam video { width: 100%; max-width: 320px; border-radius: 10px; border: 2px solid var(--gold); }
  details { margin-top: 12px; color: var(--muted); }
  #log { font-size: .85rem; line-height: 1.6; }
  footer { color: var(--muted); font-size: .75rem; margin-top: 18px; }
  @media (max-width: 520px) { #stage { height: 360px; } #portrait { font-size: 96px; } #shout { font-size: 2.4rem; } #stamp { font-size: 3.2rem; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>⚖️ おうち裁判</h1>
    <p class="sub">けんかしたら、開廷。言い分は、法廷で。</p>
  </header>

  <div id="stage">
    <div id="portrait">🦝</div>
    <div id="desk"></div>
    <div id="nameplate">タヌキ判事</div>
    <div id="box">合言葉を入れて「開廷する」を押してください。マイクを使います。</div>
    <div id="shout">異議あり！</div>
    <div id="stamp">和解</div>
    <div id="flash"></div>
  </div>

  <div class="bench">
    <span class="cast" id="c-judge">🦝 タヌキ判事</span>
    <span class="cast" id="c-bailiff">📜 書記官タヌ吉</span>
    <span class="cast" id="c-lawyerP">🐼 弁護人ポン子</span>
    <span class="cast" id="c-lawyerD">🦊 弁護人コン太</span>
    <span class="cast" id="c-witness">🧒 証言台</span>
  </div>

  <div class="controls">
    <button id="open">開廷する</button>
    <button id="objection" class="objection" disabled>異議あり！</button>
    <button id="evidenceBtn" class="ghost" disabled>📷 証拠品を出す</button>
    <button id="close" class="ghost" disabled>閉廷</button>
    <input id="pass" type="password" placeholder="家族の合言葉" autocomplete="current-password">
  </div>
  <div id="cam"><video id="video" autoplay playsinline muted></video><br><button id="submitEv">この証拠品を提出</button> <button id="cancelEv" class="ghost">やめる</button></div>
  <div id="status"></div>
  <div id="evidence"></div>
  <details><summary>法廷記録</summary><div id="log"></div></details>

  <footer>Alexa+ で「アレクサ、裁判して」と言ったときの体験を、ブラウザで再現したものです。法廷ドラマの演出は、どの作品の素材も使わず一から作っています。判例は名前・争点・判決の要約だけをおうちの中に保存します。</footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
