<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おうち裁判</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0710; --pink: #ff2d8a; --purple: #8b3dff; --ink: #fff; --muted: #c9b6d8; --gold: #ffd23f; --box: rgba(10, 5, 18, .9); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; overflow-x: hidden; }
  .display { font-family: "Dela Gothic One", "Hiragino Sans", sans-serif; letter-spacing: .04em; }
  main { max-width: 900px; margin: 0 auto; padding: 12px 16px 40px; }
  header { display: flex; align-items: center; gap: 12px; }
  h1 { margin: 6px 0; font-size: 1.8rem; transform: skewX(-8deg); text-shadow: 3px 3px 0 var(--pink); }

  /* 円形の法廷 */
  #stage { position: relative; height: 470px; border-radius: 18px; overflow: hidden; margin: 10px 0; background: #000; isolation: isolate; }
  #bg { position: absolute; inset: -12%; background: url(img/stage.jpg) center/cover; filter: brightness(.55) saturate(1.3); animation: sweep 24s ease-in-out infinite alternate; z-index: -2; }
  @keyframes sweep { from { transform: rotate(-3deg) scale(1.05); } to { transform: rotate(3deg) scale(1.12) translateX(-2%); } }
  #stage::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.75)); z-index: -1; }
  #stage.shake { animation: shake .45s; }
  @keyframes shake { 20%{transform:translate(-12px,5px)} 40%{transform:translate(10px,-6px)} 60%{transform:translate(-8px,3px)} 80%{transform:translate(6px,-2px)} }

  /* 席（輪） */
  .seat { position: absolute; width: 74px; transition: transform .35s; z-index: 2; }
  .seat .ring { width: 74px; height: 74px; border-radius: 50%; overflow: hidden; border: 3px solid rgba(255,255,255,.35); background: #000; filter: grayscale(.4) brightness(.8); transition: all .35s; }
  .seat img { width: 100%; height: 100%; object-fit: cover; object-position: center 18%; }
  .seat.on { transform: scale(1.12); }
  .seat.on .ring { border-color: var(--pink); filter: none; box-shadow: 0 0 22px var(--pink); }
  .seat span { position: absolute; top: calc(100% + 3px); left: 50%; transform: translateX(-50%); font-size: .66rem; background: rgba(0,0,0,.75); border: 1px solid var(--pink); padding: 1px 6px; border-radius: 4px; white-space: nowrap; }

  /* 話している人（大きく） */
  #hero { position: absolute; left: 50%; bottom: 122px; width: 250px; height: 250px; transform: translateX(-50%); transition: opacity .25s, transform .35s; mix-blend-mode: lighten;
    -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 58%, transparent 71%); mask-image: radial-gradient(circle at 50% 50%, #000 58%, transparent 71%); }
  #hero img { width: 100%; height: 100%; object-fit: contain; }
  #hero.swap { opacity: 0; transform: translateX(-30%) scale(.9); }
  #hero.talk img { animation: bob .3s infinite alternate; }
  @keyframes bob { to { transform: translateY(-5px) scale(1.01); } }

  /* せりふ */
  #nameplate { position: absolute; left: 14px; bottom: 120px; background: var(--pink); color: #fff; padding: 4px 16px; transform: skewX(-12deg); font-size: 1rem; z-index: 3; }
  #box { position: absolute; left: 10px; right: 10px; bottom: 10px; height: 108px; background: var(--box); border: 2px solid var(--pink); border-left: 8px solid var(--pink); padding: 12px 16px; font-size: 1.08rem; line-height: 1.6; overflow-y: auto; z-index: 3; }

  /* 飛びかう発言（ノンストップ議論ふう） */
  .fly { position: absolute; right: -60%; white-space: nowrap; font-size: 1.6rem; color: #fff; text-shadow: 2px 2px 0 #000, 0 0 12px var(--purple); transform: skewX(-12deg); animation: fly 9s linear forwards; cursor: crosshair; z-index: 2; }
  .fly b { color: var(--gold); text-shadow: 2px 2px 0 #000, 0 0 14px var(--gold); }
  @keyframes fly { to { right: 110%; } }
  .fly.hit { animation: shatter .6s forwards; }
  @keyframes shatter { 0% { filter: none; } 30% { transform: skewX(-12deg) scale(1.3); color: var(--pink); } 100% { transform: skewX(-12deg) scale(1.6) rotate(8deg); opacity: 0; filter: blur(6px); } }

  /* 論破！ 異議あり！ */
  #shout { position: absolute; left: 50%; top: 38%; transform: translate(-50%,-50%) scale(0); font-size: 4.6rem; color: #fff; padding: 6px 32px; background: linear-gradient(90deg, var(--pink), var(--purple)); transform-origin: center; text-shadow: 4px 4px 0 #000; white-space: nowrap; z-index: 6; pointer-events: none; clip-path: polygon(3% 0, 100% 8%, 97% 100%, 0 90%); }
  #shout.on { animation: shout 1.3s forwards; }
  @keyframes shout { 0%{transform:translate(-50%,-50%) scale(3) rotate(-10deg); opacity:0} 15%{transform:translate(-50%,-50%) scale(1) rotate(-6deg); opacity:1} 80%{opacity:1} 100%{transform:translate(-50%,-50%) scale(1.05) rotate(-6deg); opacity:0} }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 7; }
  #flash.on { animation: flash .35s; }
  @keyframes flash { 0%{opacity:.85} 100%{opacity:0} }

  /* 投票タイム（スロット） */
  #vote { position: absolute; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.78); z-index: 5; }
  #vote.on { display: grid; }
  #vote h2 { margin: 0 0 12px; font-size: 2.2rem; text-align: center; text-shadow: 3px 3px 0 var(--pink); }
  .reels { display: flex; gap: 10px; justify-content: center; }
  .reel { width: 150px; height: 110px; border: 3px solid var(--gold); border-radius: 10px; background: #160a22; overflow: hidden; text-align: center; padding-top: 8px; }
  .reel small { display: block; color: var(--muted); font-size: .72rem; }
  .reel .val { font-size: 1.35rem; margin-top: 8px; }
  .reel .why { font-size: .68rem; color: var(--muted); padding: 2px 6px; }
  .reel.spin .val { animation: spin .12s steps(2) infinite; }
  @keyframes spin { 0% { transform: translateY(-40%); opacity: .3; } 100% { transform: translateY(40%); opacity: .3; } }
  /* ドパガキ要素：ヒートメーター・点数・観客のリアクション・称号 */
  #heat { position: absolute; left: 12px; right: 12px; top: 10px; height: 14px; background: rgba(255,255,255,.12); border-radius: 8px; overflow: hidden; z-index: 4; }
  #heatBar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--purple), var(--pink), var(--gold)); transition: width .4s; }
  #heat.max { box-shadow: 0 0 18px var(--gold); animation: pulse .5s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.02); } }
  #score { position: absolute; right: 14px; top: 30px; z-index: 4; font-size: 1.1rem; text-shadow: 2px 2px 0 #000; }
  #combo { color: var(--gold); }
  .pop { position: absolute; z-index: 6; font-size: 1.6rem; color: var(--gold); text-shadow: 2px 2px 0 #000; animation: pop 1.2s forwards; pointer-events: none; }
  @keyframes pop { 0% { transform: scale(.4); opacity: 0; } 20% { transform: scale(1.3); opacity: 1; } 100% { transform: translateY(-80px) scale(1); opacity: 0; } }
  .emoji { position: absolute; bottom: 120px; font-size: 2rem; z-index: 4; animation: rise 2.2s ease-out forwards; pointer-events: none; }
  @keyframes rise { to { transform: translateY(-260px) rotate(20deg); opacity: 0; } }
  #title { position: absolute; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.8); z-index: 9; text-align: center; }
  #title.on { display: grid; }
  #title .badge { font-size: 2.6rem; padding: 14px 30px; border: 5px solid var(--gold); background: radial-gradient(circle, #3a1650, #12061c); text-shadow: 3px 3px 0 var(--pink); animation: stamp .5s forwards; }
  /* FEVER（ゲージ満タン） */
  #stage.fever #bg { filter: brightness(.8) saturate(2) hue-rotate(-30deg); animation: sweep 3s ease-in-out infinite alternate; }
  #stage.fever { box-shadow: 0 0 0 4px var(--pink), 0 0 40px var(--pink); animation: feverPulse .45s infinite alternate; }
  @keyframes feverPulse { to { box-shadow: 0 0 0 4px var(--gold), 0 0 60px var(--gold); } }
  #feverClock { position: absolute; left: 14px; top: 30px; z-index: 4; font-size: 1.3rem; color: var(--gold); text-shadow: 2px 2px 0 #000; }
  /* いまの状況（段取りの進み具合） */
  #steps { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0; }
  #steps span { font-size: .78rem; padding: 4px 10px; background: #1d1028; color: var(--muted); transform: skewX(-10deg); }
  #steps span.done { background: #3a1f4d; color: #fff; }
  #steps span.now { background: var(--pink); color: #fff; box-shadow: 0 0 12px var(--pink); }
  #paused { position: absolute; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.7); z-index: 9; font-size: 2.6rem; text-shadow: 3px 3px 0 var(--pink); }
  #paused.on { display: grid; }
  /* 点数の大きい表示 */
  .bigScore { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); text-align: center; z-index: 8; pointer-events: none; animation: bigScore 2.2s forwards; text-shadow: 3px 3px 0 #000; }
  .bigScore div:first-child { font-size: 1.6rem; color: #fff; }
  .bigScore .plus { font-size: 3rem; color: var(--gold); }
  .bigScore .total { font-size: 1.1rem; color: var(--pink); background: rgba(0,0,0,.6); padding: 2px 10px; display: inline-block; }
  @keyframes bigScore { 0% { transform: translateX(-50%) scale(.3); opacity: 0; } 12% { transform: translateX(-50%) scale(1.15); opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(-50%) translateY(-40px); opacity: 0; } }
  #score { font-size: 1.5rem !important; }
  #score.bump { animation: bump .5s; }
  @keyframes bump { 40% { transform: scale(1.4); color: var(--gold); } }
  /* 証拠品を大きく見せる */
  .evBig { position: absolute; left: 50%; top: 45%; transform: translate(-50%,-50%) rotate(-3deg); width: 260px; background: #160a22; border: 4px solid var(--gold); z-index: 8; text-align: center; font-size: .9rem; animation: stamp .4s forwards; box-shadow: 0 0 30px var(--gold); }
  .evBig img { width: 100%; display: block; }
  /* 段の掲示 */
  #banner { position: absolute; left: 0; right: 0; top: 34%; text-align: center; font-size: 2rem; color: #fff; background: linear-gradient(90deg, transparent, var(--purple) 20%, var(--pink) 80%, transparent); padding: 10px; transform: scaleY(0); z-index: 6; pointer-events: none; text-shadow: 3px 3px 0 #000; }
  #banner.on { animation: banner 2.4s forwards; }
  @keyframes banner { 0% { transform: scaleY(0); } 10% { transform: scaleY(1); } 85% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }
  button.glow { animation: glow .6s infinite alternate; }
  @keyframes glow { to { box-shadow: 0 0 22px var(--gold), 4px 4px 0 #000; } }
  /* 後ろを流れる観客のテロップ */
  .tel { position: absolute; left: -30%; white-space: nowrap; font-size: 1.3rem; color: rgba(255,255,255,.28); transform: skewX(-12deg); animation: tel 6s linear forwards; z-index: 1; pointer-events: none; }
  @keyframes tel { to { left: 110%; } }
  #resume { display: none; }
  /* 罰ゲームのルーレット */
  #roulette { position: absolute; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.82); z-index: 5; text-align: center; }
  #roulette.on { display: grid; }
  #roulette h2 { margin: 0 0 6px; font-size: 1.8rem; color: var(--gold); text-shadow: 3px 3px 0 var(--pink); }
  #rWho { color: var(--muted); margin-bottom: 10px; }
  #rItem { font-size: 1.7rem; padding: 18px 26px; border: 4px solid var(--gold); background: #160a22; min-width: 280px; max-width: 90vw; }
  #rItem.done { border-color: var(--pink); box-shadow: 0 0 28px var(--pink); }
  #count { font-size: 5rem; color: #fff; text-shadow: 4px 4px 0 var(--pink); margin-top: 10px; min-height: 1.2em; }
  /* 閉廷の紙吹雪 */
  .confetti { position: absolute; top: -20px; width: 10px; height: 16px; z-index: 8; animation: fall 2.6s linear forwards; }
  @keyframes fall { to { transform: translateY(520px) rotate(720deg); opacity: .2; } }
  #shout.gold { background: linear-gradient(90deg, var(--gold), var(--pink)); color: #1a0b22; text-shadow: 3px 3px 0 #fff; }
  #stamp { position: absolute; left: 50%; top: 42%; transform: translate(-50%,-50%) scale(3); opacity: 0; font-size: 5rem; color: var(--pink); border: 8px solid var(--pink); padding: 0 24px; background: rgba(0,0,0,.85); z-index: 6; pointer-events: none; }
  #stamp.on { animation: stamp .45s forwards; }
  @keyframes stamp { to { transform: translate(-50%,-50%) scale(1) rotate(-8deg); opacity: 1; } }

  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; padding: 13px 22px; border: 0; cursor: pointer; color: #fff; background: var(--pink); transform: skewX(-10deg); box-shadow: 4px 4px 0 #000; }
  button > span { display: inline-block; transform: skewX(10deg); }
  button:disabled { opacity: .3; cursor: default; }
  button.sub { background: #2a1838; }
  button.big { font-size: 1.25rem; padding: 16px 30px; background: linear-gradient(90deg, var(--pink), var(--purple)); }
  #status { color: var(--muted); margin: 8px 0; min-height: 1.4em; font-size: .9rem; }
  #evidence { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .ev { width: 96px; border: 2px solid var(--gold); overflow: hidden; background: #160a22; font-size: .7rem; text-align: center; }
  .ev img { width: 100%; height: 72px; object-fit: cover; display: block; }
  #cam { display: none; margin: 8px 0; }
  #cam video { width: 100%; max-width: 320px; border: 2px solid var(--gold); }
  details { margin-top: 14px; color: var(--muted); font-size: .85rem; }
  footer { color: var(--muted); font-size: .72rem; margin-top: 16px; line-height: 1.6; }
  #pass { display: none; }
  @media (max-width: 560px) {
    #banner { font-size: 1.25rem; }
    #stage { height: 430px; } #hero { width: 200px; height: 200px; } .seat, .seat .ring { width: 54px; } .seat .ring { height: 54px; } .seat span { font-size: .55rem; }
    #shout { font-size: 2.8rem; } #stamp { font-size: 3.2rem; } .reel { width: 100px; } .fly { font-size: 1.2rem; }
  }
</style>
</head>
<body>
<main>
  <header><h1 class="display">おうち裁判</h1></header>

  <div id="steps"></div>
  <div id="stage">
    <div id="bg"></div>
    <div id="heat"><div id="heatBar"></div></div>
    <div id="feverClock" class="display"></div>
    <div id="score" class="display">論破 <span id="pts">0</span>pt <span id="combo"></span></div>
    <div id="title"><div><div style="color:var(--muted)">本日の称号</div><div class="badge display" id="badge">論破王</div></div></div>
    <div id="hero"><img id="heroImg" src="img/judge.jpg" alt=""></div>
    <div id="nameplate" class="display">裁判長タヌキ</div>
    <div id="box">けんかしたら、開廷。下の「開廷する」を押して、マイクを許可してね。</div>
    <div id="shout" class="display">論破！</div>
    <div id="vote"><div><h2 class="display">投票タイム</h2><div class="reels" id="reels"></div></div></div>
    <div id="roulette"><div><h2 class="display">罰ゲーム</h2><div id="rWho"></div><div id="rItem" class="display">？？？</div><div id="count" class="display"></div></div></div>
    <div id="stamp" class="display">和解</div>
    <div id="banner" class="display"></div>
    <div id="paused" class="display">⏸ 一時停止中</div>
    <div id="flash"></div>
  </div>

  <div class="controls">
    <button id="open" class="big display"><span>開廷する</span></button>
    <button id="ronpa" class="display" disabled><span>論破！</span></button>
    <button id="objection" class="sub" disabled><span>異議あり！</span></button>
    <button id="evidenceBtn" class="sub" disabled><span>📷 証拠品</span></button>
    <button id="verdictBtn" class="sub" disabled><span>⚖️ 判決へ</span></button>
    <button id="pauseBtn" class="sub" disabled><span>⏸ 一時停止</span></button>
    <button id="close" class="sub" disabled><span>閉廷</span></button>
    <button id="resume" class="big display"><span>再開する</span></button>
    <input id="pass" type="password">
  </div>
  <div id="cam"><video id="video" autoplay playsinline muted></video><br><button id="submitEv"><span>この証拠品を突きつける</span></button> <button id="cancelEv" class="sub"><span>やめる</span></button></div>
  <div id="status"></div>
  <div id="evidence"></div>
  <details><summary>法廷記録</summary><pre id="log" style="white-space:pre-wrap"></pre></details>
  <footer>飛んでくる発言をタップすると「論破！」。言い分がおかしいと思ったら撃ち抜こう。<br>Alexa+ で「アレクサ、裁判して」と言ったときの体験を、ブラウザで再現したものです。キャラも演出もオリジナルです。判例は名前・争点・判決の要約だけを保存します。</footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
